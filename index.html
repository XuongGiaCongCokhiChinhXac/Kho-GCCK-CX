    function toggleSort(key) {
      if (sortState.key === key) {
        sortState.dir = -sortState.dir;
      } else {
        sortState.key = key;
        sortState.dir = 1;
      }
      render(applyFilters(lastRows));
    }

    function sortRows(rows) {
      if (!sortState.key) return rows;
      const key = sortState.key;
      const dir = sortState.dir;
      return rows.slice().sort(function(a, b) {
        let va = a[key], vb = b[key];
        if (typeof va === 'boolean' || typeof vb === 'boolean') {
          va = va ? 1 : 0; vb = vb ? 1 : 0;
          return (va - vb) * dir;
        }
        const na = Number(va), nb = Number(vb);
        const bothNumeric = va !== null && va !== '' && vb !== null && vb !== '' && !isNaN(na) && !isNaN(nb);
        if (bothNumeric) return (na - nb) * dir;
        va = (va === null || va === undefined) ? '' : String(va);
        vb = (vb === null || vb === undefined) ? '' : String(vb);
        return va.localeCompare(vb, 'vi') * dir;
      });
    }

    function buildHeaderRow() {
      let row = '<tr>';
      getVisibleColumns().forEach(function(col) {
        const thClass = getColClass(col);
        const isSorted = sortState.key === col.key;
        const arrow = isSorted ? (sortState.dir === 1 ? ' &#9650;' : ' &#9660;') : '';
        const labelHtml = '<span class="th-label" onclick="toggleSort(\'' + col.key + '\')" title="Bấm để sắp xếp">' +
          col.label + arrow + '</span>';

        if (col.filterable) {
          const activeCls = filters[col.key] ? ' active' : '';
          row += '<th' + thClass + '>' + labelHtml +
            '<span class="filter-icon' + activeCls + '" onclick="openFilterPopup(\'' + col.key + '\', this)">&#9662;</span>' +
            '</th>';
        } else {
          row += '<th' + thClass + '>' + labelHtml + '</th>';
        }
      });
      row += '</tr>';
      return row;
    }

    function renderEmptyTable() {
      const result = document.getElementById('result');
      let html = '<table>' + buildHeaderRow();
      html += '<tr><td colspan="' + getVisibleColumns().length +
        '" class="empty-state-cell">Hãy nhập lệnh sản xuất để tìm kiếm.</td></tr>';
      html += '</table>';
      result.innerHTML = html;
      applyStickyColumn();
    }

    function buildRowHtml_(r, rIdx) {
      const lsxStt = r.lsx_stt || '';
      let html = '<tr data-lsxstt="' + String(lsxStt).replace(/"/g, '&quot;') +
        '" data-row="' + (r.thu_tu || '') + '">';
      // Chỉ vẽ các cột đang bật, nhưng data-c vẫn phải là chỉ số THẬT trong mảng COLUMNS gốc
      // (không phải chỉ số trong danh sách đã lọc), vì toàn bộ hệ thống chọn ô/copy/paste
      // đang tra cứu qua COLUMNS[cIdx] - nếu đánh số lại sẽ chọn nhầm cột khi có cột bị ẩn.
      getVisibleColumns().forEach(function(col) {
        const cIdx = COLUMNS.indexOf(col);
        const value = r[col.key];
        let display;
        let plainText;

        if (col.bool) {
          const checked = value ? 'checked' : '';
          display = '<input type="checkbox" class="row-chk" ' + checked +
            ' onchange="onBoolChange(this,\'' + col.key + '\')" />';
          plainText = '';
        } else if (col.key === 'khgh') {
          plainText = formatDate(value);
          display = plainText;
        } else if (col.key === 'msct') {
          plainText = value || '';
          display = value
            ? '<span class="copyable" onclick="copyCell(this)">' + value + '</span>'
            : '';
        } else if (col.key === 'ghi_chu') {
          plainText = value || '';
          const safeNote = escapeHtml_(plainText);
          const lineCount = plainText ? plainText.split('\n').length : 1;
          const rowsAttr = Math.min(Math.max(lineCount, 1), 6);
          display = '<textarea class="row-note" rows="' + rowsAttr + '"' +
            ' data-old="' + safeNote.replace(/"/g, '&quot;') + '"' +
            ' onchange="onNoteChange(this)"' +
            ' oninput="autoGrowNote(this)"' +
            ' onfocus="autoGrowNote(this)"' +
            ' onkeydown="handleNoteKeydown(event,this)">' + safeNote + '</textarea>';
        } else {
          plainText = value || '';
          display = plainText;
        }

        let attrs = getColClass(col);
        if (plainText && col.key !== 'ghi_chu') {
          attrs += ' data-full="' + String(plainText).replace(/"/g, '&quot;') + '"';
        }
        attrs += ' data-r="' + rIdx + '" data-c="' + cIdx + '"';

        html += '<td' + attrs + '>' + display + '</td>';
      });
      html += '</tr>';
      return html;
    }

        // Gom các dòng liên tiếp có cùng LSX thành 1 nhóm, rồi đảo NGƯỢC THỨ TỰ CÁC NHÓM
    // (nhóm xuất hiện sau trong Sheet - tức lệnh mới hơn - được đưa lên trước), nhưng
    // giữ NGUYÊN thứ tự STT tăng dần bên trong mỗi nhóm để khớp với phiếu giấy.
    function reverseByLsxGroup_(rows) {
      if (rows.length === 0) return rows;
      const groups = [];
      let current = [rows[0]];
      for (let i = 1; i < rows.length; i++) {
        if (rows[i].lsx === rows[i - 1].lsx) {
          current.push(rows[i]);
        } else {
          groups.push(current);
          current = [rows[i]];
        }
      }
      groups.push(current);
      groups.reverse();

      // Chủ động sắp STT CT tăng dần bên trong từng lệnh, KHÔNG dựa vào thứ tự có sẵn
      // trong Sheet nữa - vì có lệnh được nhập liệu theo thứ tự giảm dần (VD dán dữ
      // liệu ngược), giữ nguyên thứ tự gốc sẽ ra sai như 336,335,330,327... thay vì
      // đúng thứ tự để đối chiếu với phiếu giấy.
      groups.forEach(function(g) {
        g.sort(function(a, b) {
          const na = Number(a.stt_ct), nb = Number(b.stt_ct);
          const bothNumeric = a.stt_ct !== null && a.stt_ct !== '' &&
            b.stt_ct !== null && b.stt_ct !== '' && !isNaN(na) && !isNaN(nb);
          if (bothNumeric) return na - nb;
          return String(a.stt_ct || '').localeCompare(String(b.stt_ct || ''), 'vi');
        });
      });

      return groups.reduce(function(acc, g) { return acc.concat(g); }, []);
    }

    let renderToken = 0; // để hủy đợt render dở dang khi có lượt tìm kiếm/lọc mới hơn
    const INITIAL_RENDER_LIMIT = 800;  // chỉ dựng sẵn 800 dòng đầu tiên, tránh đơ khi có hàng chục nghìn dòng
    const LOAD_MORE_STEP = 500;        // mỗi lần cuộn gần tới đáy, dựng thêm 500 dòng
    let renderRowsRef = [];            // toàn bộ dòng của lượt hiển thị hiện tại (kể cả phần CHƯA có trong DOM)
    let renderedCount = 0;             // số dòng THẬT SỰ đã có trong DOM tính tới thời điểm hiện tại
    let isBuildingInitialChunk = false; // đang dựng đợt đầu tiên -> chặn renderMoreRows_ chạy chồng lên
    let isLoadingMore = false;          // đang dựng đợt "tải thêm" -> chặn gọi chồng lên chính nó

    function render(rows) {
      const result = document.getElementById('result');
      const status = document.getElementById('status');

      rows = sortRows(rows);

      // Mặc định (chưa bấm sort cột nào): đưa các LỆNH (LSX) mới hơn lên trước để ưu
      // tiên hiển thị đơn hàng hiện tại/chưa xong, nhưng chỉ đảo thứ tự GIỮA CÁC LỆNH
      // với nhau - các dòng bên trong cùng 1 lệnh vẫn giữ đúng thứ tự STT tăng dần.
      if (!sortState.key) {
        rows = reverseByLsxGroup_(rows);
      }

      status.textContent = 'Tìm thấy ' + rows.length + '/' + lastRows.length + ' dòng.';
      displayedRows = rows;
      updateSummary(rows); // đếm theo đúng dữ liệu đang hiển thị (sau khi lọc), không phải toàn bộ lastRows
      clearSelection();

      const myToken = ++renderToken;
      renderRowsRef = rows;
      renderedCount = 0;

      if (lastRows.length === 0) {
        result.innerHTML = '<p>Không có dữ liệu.</p>';
        return;
      }

      result.innerHTML = '<table id="mainTable">' + buildHeaderRow() + '</table>';
      const table = document.getElementById('mainTable');

      if (rows.length === 0) {
        table.insertAdjacentHTML('beforeend', '<tr><td colspan="' + getVisibleColumns().length +
          '" style="text-align:center; color:#999; padding:16px;">Không có dữ liệu phù hợp với bộ lọc.</td></tr>');
        applyStickyColumn();
        return;
      }

      // CHỈ dựng sẵn INITIAL_RENDER_LIMIT dòng đầu. Với danh sách vài nghìn/chục nghìn
      // dòng (VD bấm nút BUS ra 15.000 dòng), dựng HẾT toàn bộ vào DOM luôn làm trình
      // duyệt đơ/giật dù có chia nhỏ bằng requestAnimationFrame - vì số node DOM cuối
      // cùng vẫn y hệt. Phần còn lại chỉ dựng thêm khi người dùng cuộn gần tới đáy
      // (xem renderMoreRows_ + listener scroll bên dưới).
      setLoading(true);
      isBuildingInitialChunk = true; // chặn renderMoreRows_ chạy chồng lên trong lúc đang dựng đợt đầu
      const CHUNK_SIZE = 300;
      let index = 0;
      const limitThisBatch = Math.min(INITIAL_RENDER_LIMIT, rows.length);

      function renderChunk() {
        if (myToken !== renderToken) return; // đã có lượt tìm kiếm/lọc mới hơn -> hủy đợt này

        let chunkHtml = '';
        const limit = Math.min(index + CHUNK_SIZE, limitThisBatch);
        for (; index < limit; index++) {
          chunkHtml += buildRowHtml_(rows[index], index);
        }
        table.insertAdjacentHTML('beforeend', chunkHtml);
        renderedCount = index;

        if (index < limitThisBatch) {
          requestAnimationFrame(renderChunk);
        } else {
          isBuildingInitialChunk = false;
          setLoading(false);
          applyStickyColumn();
          maybeShowLoadMoreHint_();
        }
      }

      requestAnimationFrame(renderChunk);
    }

    // Dựng thêm 1 đợt dòng tiếp theo (gọi khi cuộn gần đáy khu vực kết quả).
    function renderMoreRows_() {
      // Chặn chạy trong lúc đợt đầu tiên CHƯA dựng xong, và chặn chạy chồng lên chính nó.
      // Đây chính là nguyên nhân gây nhân đôi dữ liệu (VD 8 dòng hiện thành 16): khi
      // bảng cũ (nhiều dòng, đang cuộn xuống sâu) bị thay bằng bảng mới ít dòng hơn,
      // trình duyệt tự đưa scrollTop về 0 và bắn sự kiện 'scroll' NGAY LẬP TỨC, đúng
      // lúc renderedCount vẫn là 0 (chưa kịp cập nhật) -> tưởng "chưa dựng gì" nên tự
      // dựng lại y hệt đợt đầu, chạy song song với renderChunk() của render().
      if (isBuildingInitialChunk || isLoadingMore) return;
      if (renderedCount >= renderRowsRef.length) return; // đã dựng hết rồi

      isLoadingMore = true;
      const myToken = renderToken;
      const table = document.getElementById('mainTable');
      if (!table) { isLoadingMore = false; return; }

      const targetLimit = Math.min(renderedCount + LOAD_MORE_STEP, renderRowsRef.length);
      const CHUNK_SIZE = 300;
      let index = renderedCount;

      function renderChunk() {
        if (myToken !== renderToken) { isLoadingMore = false; return; }
        let chunkHtml = '';
        const limit = Math.min(index + CHUNK_SIZE, targetLimit);
        for (; index < limit; index++) {
          chunkHtml += buildRowHtml_(renderRowsRef[index], index);
        }
        table.insertAdjacentHTML('beforeend', chunkHtml);
        renderedCount = index;

        if (index < targetLimit) {
          requestAnimationFrame(renderChunk);
        } else {
          isLoadingMore = false;
          applyStickyColumn();
          maybeShowLoadMoreHint_();
        }
      }

      requestAnimationFrame(renderChunk);
    }

    function maybeShowLoadMoreHint_() {
      const status = document.getElementById('status');
      if (renderedCount < renderRowsRef.length) {
        status.textContent = 'Đang hiển thị ' + renderedCount + '/' + renderRowsRef.length +
          ' dòng — cuộn xuống để tải thêm.';
      }
    }

    function applyStickyColumn() {
      const table = document.querySelector('#result table');
      if (!table || table.rows.length === 0) return;

      const headerRow = table.rows[0];
      const headerStickyCells = headerRow.querySelectorAll('.sticky-col');
      if (headerStickyCells.length === 0) return;

      // Chỉ đo 1 lần trên hàng header (rất ít phần tử), rồi áp dụng "left" cho
      // TOÀN BỘ dòng cùng lúc bằng 1 khối CSS (qua nth-child). KHÔNG lặp qua
      // từng dòng dữ liệu để ghi style như trước — với hàng chục nghìn dòng,
      // cách cũ chính là nguyên nhân gây "Trang không phản hồi".
      const lefts = [];
      let acc = 0;
      headerStickyCells.forEach(function(cell) {
        lefts.push(acc);
        acc += cell.getBoundingClientRect().width; // số thực (có phần thập phân), tránh lệch do làm tròn
      });

      // Tính vị trí nth-child dựa trên thứ tự CỘT ĐANG HIỂN THỊ THẬT trên DOM,
      // không dựa vào chỉ số trong mảng COLUMNS gốc - để không bị lệch khi có cột đang bị ẩn.
      const allHeaderCells = headerRow.querySelectorAll('th');
      const stickyColPositions = [];
      allHeaderCells.forEach(function(cell, idx) {
        if (cell.classList.contains('sticky-col')) stickyColPositions.push(idx + 1);
      });

      let css = '';
      stickyColPositions.forEach(function(pos, i) {
        css += '#result table td:nth-child(' + pos + '), ' +
               '#result table th:nth-child(' + pos + ') { left: ' + lefts[i] + 'px; }\n';
      });

      let styleTag = document.getElementById('stickyColStyle');
      if (!styleTag) {
        styleTag = document.createElement('style');
        styleTag.id = 'stickyColStyle';
        document.head.appendChild(styleTag);
      }
      styleTag.textContent = css;
    }

    function findRowData(lsxStt) {
      return lastRows.find(function(r) { return String(r.lsx_stt) === String(lsxStt); });
    }

    function escapeHtml_(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function autoGrowNote(el) {
      el.style.height = 'auto';
      el.style.height = el.scrollHeight + 'px';
    }

    // Bấm tick là hiện đúng trạng thái ngay lập tức (UI lạc quan), việc lưu chạy ngầm phía sau.
    // Nếu lưu thất bại mới trả checkbox về trạng thái cũ.
    function onBoolChange(checkbox, field, recordUndo) {
      if (recordUndo === undefined) recordUndo = true;
      const tr = checkbox.closest('tr');
      const lsxStt = tr.getAttribute('data-lsxstt');
      const value = checkbox.checked;
      const pKey = pendingKey_(lsxStt, field);

      const row = findRowData(lsxStt);
      if (recordUndo) pushUndo([{ lsxStt: lsxStt, field: field, oldValue: row ? row[field] : !value }]);
      if (row) row[field] = value;
      updateSummary(lastRows);
      pendingSaves.add(pKey);
      const sheetRow = tr.getAttribute('data-row');

      google.script.run
        .withSuccessHandler(function() { pendingSaves.delete(pKey); refreshSyncStatus(); })
        .withFailureHandler(function(err) {
          pendingSaves.delete(pKey);
          checkbox.checked = !value;
          if (row) row[field] = !value;
          updateSummary(lastRows);
          showToast('Không thể lưu: ' + err.message, 'error');
        })
        .updateBomField(lsxStt, field, value, sheetRow);
    }

    // Lưu ghi chú (gọi khi rời ô hoặc bấm Enter chuyển dòng). UI lạc quan tương tự checkbox.
    function onNoteChange(input, recordUndo) {
      if (recordUndo === undefined) recordUndo = true;
      const tr = input.closest('tr');
      const lsxStt = tr.getAttribute('data-lsxstt');
      const value = input.value;
      const oldValue = input.getAttribute('data-old') || '';
      if (value === oldValue) return;
      const pKey = pendingKey_(lsxStt, 'ghi_chu');

      if (recordUndo) pushUndo([{ lsxStt: lsxStt, field: 'ghi_chu', oldValue: oldValue }]);
      input.setAttribute('data-old', value);
      const row = findRowData(lsxStt);
      if (row) row.ghi_chu = value;
      pendingSaves.add(pKey);
      const sheetRow = tr.getAttribute('data-row');

      google.script.run
        .withSuccessHandler(function() { pendingSaves.delete(pKey); refreshSyncStatus(); })
        .withFailureHandler(function(err) {
          pendingSaves.delete(pKey);
          input.value = oldValue;
          input.setAttribute('data-old', oldValue);
          autoGrowNote(input);
          if (row) row.ghi_chu = oldValue;
          showToast('Không thể lưu ghi chú: ' + err.message, 'error');
        })
        .updateBomField(lsxStt, 'ghi_chu', value, sheetRow);
    }

    // Điều hướng phím kiểu Excel trong ô Ghi chú:
    // Enter        -> lưu và chuyển xuống ô Ghi chú của dòng kế tiếp
    // Ctrl + Enter -> xuống dòng trong cùng ô
    // Esc          -> hủy chỉnh sửa, khôi phục giá trị cũ, thoát khỏi ô
    function handleNoteKeydown(event, el) {
      if (event.key === 'Enter' && (event.ctrlKey || event.metaKey)) {
        event.preventDefault();
        const start = el.selectionStart;
        const end = el.selectionEnd;
        el.value = el.value.slice(0, start) + '\n' + el.value.slice(end);
        el.selectionStart = el.selectionEnd = start + 1;
        autoGrowNote(el);
        return;
      }
      if (event.key === 'Enter') {
        event.preventDefault();
        if (el.value !== el.getAttribute('data-old')) onNoteChange(el);
        const tr = el.closest('tr');
        const nextTr = tr ? tr.nextElementSibling : null;
        const nextNote = nextTr ? nextTr.querySelector('.row-note') : null;
        if (nextNote) {
          nextNote.focus();
          const len = nextNote.value.length;
          nextNote.selectionStart = nextNote.selectionEnd = len;
        } else {
          el.blur();
        }
        return;
      }
      if (event.key === 'Escape') {
        event.preventDefault();
        el.value = el.getAttribute('data-old') || '';
        autoGrowNote(el);
        el.blur();
      }
    }

    /* ================= TỰ LÀM MỚI CHO NGƯỜI KHÁC ĐANG XEM CÙNG LỆNH ================= */

    function startPolling() {
      stopPolling();
      if (!currentQuery) return;
      pollTimer = setInterval(pollForUpdates, POLL_INTERVAL_MS);
    }

    function stopPolling() {
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    }

    function pollForUpdates() {
      if (!currentQuery) return;
      const runner = google.script.run
        .withSuccessHandler(mergeRemoteChanges)
        .withFailureHandler(function() { /* im lặng bỏ qua, lần sau tự thử lại */ });

      if (currentQueryMode === 'prefix') {
        runner.searchByPrefix(currentQuery);
      } else {
        runner.searchByLSX(currentQuery);
      }
    }

    // So sánh dữ liệu mới nhất từ server với dữ liệu đang hiển thị,
    // chỉ cập nhật đúng những ô VT/GH/NMK/Ghi chú bị thay đổi bởi người khác,
    // không load lại cả bảng nên không mất vị trí cuộn hay đang gõ dở.
    function mergeRemoteChanges(freshRows) {
      let summaryNeedsUpdate = false;

      const trMap = {};
      document.querySelectorAll('#result tr[data-lsxstt]').forEach(function(tr) {
        trMap[tr.getAttribute('data-lsxstt')] = tr;
      });

      const colIndex = {};
      COLUMNS.forEach(function(c, i) { colIndex[c.key] = i; });

      freshRows.forEach(function(fresh) {
        const local = findRowData(fresh.lsx_stt);
        if (!local) return;
        const tr = trMap[fresh.lsx_stt];

        BOOL_KEYS.forEach(function(key) {
          if (pendingSaves.has(pendingKey_(fresh.lsx_stt, key))) return; // đang chờ lưu -> chưa ghi đè
          if (local[key] !== fresh[key]) {
            local[key] = fresh[key];
            summaryNeedsUpdate = true;
            if (tr) {
              const cell = tr.cells[colIndex[key]];
              const cb = cell ? cell.querySelector('.row-chk') : null;
              if (cb) cb.checked = fresh[key];
            }
          }
        });

        if (pendingSaves.has(pendingKey_(fresh.lsx_stt, 'ghi_chu'))) return; // đang chờ lưu -> chưa ghi đè
        if (local.ghi_chu !== fresh.ghi_chu) {
          const cell = tr ? tr.cells[colIndex['ghi_chu']] : null;
          const noteEl = cell ? cell.querySelector('.row-note') : null;
          if (noteEl && document.activeElement === noteEl) {
            // Đang gõ dở đúng ô này -> không ghi đè, đợi lần poll sau
          } else {
            local.ghi_chu = fresh.ghi_chu;
            if (noteEl) {
              noteEl.value = fresh.ghi_chu || '';
              noteEl.setAttribute('data-old', fresh.ghi_chu || '');
              autoGrowNote(noteEl);
            }
          }
        }
      });

      if (summaryNeedsUpdate) updateSummary(displayedRows); // đếm theo dữ liệu đang hiển thị (sau lọc), không phải toàn bộ
    }

    /* ---------- Chọn ô: click, kéo chọn, phím mũi tên/Enter ---------- */

    // Vùng chọn tổng (hình chữ nhật bao trọn TẤT CẢ các vùng đang chọn) - dùng cho các
    // thao tác cần 1 phạm vi liên tục như Dán, Xóa, Điền xuống/phải.
    function cellRect() {
      if (selRegions.length === 0) return { r1: 0, r2: -1, c1: 0, c2: -1 }; // rỗng, không khớp ô nào
      let r1 = Infinity, r2 = -Infinity, c1 = Infinity, c2 = -Infinity;
      selRegions.forEach(function(reg) {
        r1 = Math.min(r1, reg.r1); r2 = Math.max(r2, reg.r2);
        c1 = Math.min(c1, reg.c1); c2 = Math.max(c2, reg.c2);
      });
      return { r1: r1, r2: r2, c1: c1, c2: c2 };
    }

    // Ô (r,c) có thực sự nằm trong 1 trong các vùng đang chọn không - phân biệt với
    // những ô chỉ nằm trong vùng bao (cellRect) nhưng không được chọn (trường hợp Ctrl+Click rời rạc).
    function isCellSelected(r, c) {
      return selRegions.some(function(reg) {
        return r >= reg.r1 && r <= reg.r2 && c >= reg.c1 && c <= reg.c2;
      });
    }

    function clearSelection() {
      selRegions = [];
      selAnchorR = selAnchorC = activeR = activeC = -1;
      document.querySelectorAll('#result td.cell-selected, #result td.cell-active')
        .forEach(function(td){ td.classList.remove('cell-selected','cell-active'); });
      document.querySelectorAll('#result tr.row-focus')
        .forEach(function(tr){ tr.classList.remove('row-focus'); });
      const bar = document.getElementById('selectionBar');
      if (bar) bar.style.display = 'none';
      updateCellInfoBar();
    }

    // Bấm chuột thường (không giữ phím gì) -> bỏ hết chọn cũ, chỉ chọn đúng 1 ô này.
    function selectSingle(r, c) {
      selRegions = [{ r1: r, r2: r, c1: c, c2: c }];
      selAnchorR = r; selAnchorC = c;
      activeR = r; activeC = c;
      paintSelection();
    }

    // Kéo chuột hoặc giữ Shift rồi bấm -> mở rộng từ ô neo (selAnchorR/C) tới ô (r,c) này,
    // chọn 1 dải ô liên tục kiểu Excel.
    function extendSelection(r, c) {
      if (selAnchorR < 0) { selectSingle(r, c); return; }
      const rect = {
        r1: Math.min(selAnchorR, r), r2: Math.max(selAnchorR, r),
        c1: Math.min(selAnchorC, c), c2: Math.max(selAnchorC, c)
      };
      if (selRegions.length === 0) selRegions.push(rect);
      else selRegions[selRegions.length - 1] = rect; // luôn chỉnh sửa vùng đang "sống" cuối cùng
      activeR = r; activeC = c;
      paintSelection();
    }

    // Giữ Ctrl rồi bấm -> thêm/bớt đúng 1 ô này vào danh sách đang chọn, KHÔNG xóa các ô
    // đã chọn trước đó (chọn nhiều ô rời rạc, giống Ctrl+Click trong Excel).
    function toggleCellRegion(r, c) {
      const idx = selRegions.findIndex(function(reg) {
        return reg.r1 === r && reg.r2 === r && reg.c1 === c && reg.c2 === c;
      });
      if (idx !== -1) {
        selRegions.splice(idx, 1); // đã có đúng ô này -> bấm lại để bỏ chọn
      } else {
        selRegions.push({ r1: r, r2: r, c1: c, c2: c });
      }
      selAnchorR = r; selAnchorC = c; // ô này thành neo mới cho lần Shift+Click tiếp theo
      activeR = r; activeC = c;
      paintSelection();
    }

    // Hiện tên cột + giá trị của ô đang active (giống thanh công thức fx trong Excel)
    function updateCellInfoBar() {
      const bar = document.getElementById('cellInfoBar');
      if (!bar) return;
      if (activeR < 0 || activeC < 0 || !displayedRows[activeR] || !COLUMNS[activeC]) {
        bar.textContent = 'Chưa chọn ô nào';
        return;
      }
      const row = displayedRows[activeR];
      const col = COLUMNS[activeC];
      let value = row[col.key];
      if (col.bool) value = value ? 'TRUE' : 'FALSE';
      else if (col.key === 'khgh') value = formatDate(value);
      else value = (value === null || value === undefined || value === '') ? '(trống)' : value;
      bar.textContent = col.label + ': ' + value;
    }

    function paintSelection() {
      document.querySelectorAll('#result td.cell-selected, #result td.cell-active')
        .forEach(function(td){ td.classList.remove('cell-selected','cell-active'); });
      document.querySelectorAll('#result tr.row-focus')
        .forEach(function(tr){ tr.classList.remove('row-focus'); });

      if (selRegions.length === 0) return;
      const cells = document.querySelectorAll('#result td[data-r]');
      let count = 0, sum = 0, hasNumeric = false;

      cells.forEach(function(td) {
        const r = Number(td.getAttribute('data-r'));
        const c = Number(td.getAttribute('data-c'));
        if (isCellSelected(r, c)) {
          td.classList.add('cell-selected');
          const tr = td.closest('tr');
          if (tr) tr.classList.add('row-focus'); // tô sáng TẤT CẢ các hàng có ô đang được chọn
          count++;
          const val = getCellStatValue_(td);
          if (val !== null) { hasNumeric = true; sum += val; }
        }
      });

      const activeTd = document.querySelector('#result td[data-r="' + activeR + '"][data-c="' + activeC + '"]');
      if (activeTd) {
        activeTd.classList.add('cell-active');
        const activeTr = activeTd.closest('tr');
        if (activeTr) activeTr.classList.add('row-focus'); // tô sáng cả hàng chứa ô vừa thao tác
      }
      updateCellInfoBar();

      const bar = document.getElementById('selectionBar');
      if (count > 1) {
        bar.style.display = 'flex';
        bar.innerHTML = '<span>Đã chọn: <b>' + count + '</b> ô</span>' +
          (hasNumeric ? '<span>Tổng: <b>' + sum.toLocaleString('vi-VN') + '</b></span>' : '');
      } else {
        bar.style.display = 'none';
      }
    }

    function getCellStatValue_(td) {
      const cb = td.querySelector('.row-chk');
      if (cb) return null; // checkbox chỉ đếm số ô, không cộng tổng
      const ta = td.querySelector('.row-note');
      const text = ta ? ta.value : td.textContent;
      const num = Number(String(text).trim().replace(',', '.'));
      return (text && !isNaN(num)) ? num : null;
    }

    document.getElementById('result').addEventListener('mousedown', function(e) {
      const td = e.target.closest('td[data-r]');
      if (!td) return;

      // Bỏ focus khỏi ô input/textarea đang giữ focus (nếu có) TRƯỚC khi xử lý tiếp.
      // Lý do: e.preventDefault() bên dưới (chặn bôi đen chữ) cũng vô tình chặn luôn
      // hành vi focus mặc định của trình duyệt khi bấm vào ô -> focus bị kẹt lại ở
      // input cũ (VD ô tìm kiếm) -> Ctrl+C/D/R/V bị nhánh "if INPUT return" bỏ qua ->
      // trình duyệt tự xử lý Ctrl+D/R theo mặc định (Bookmark/Reload trang).
      if (document.activeElement && document.activeElement !== document.body) {
        document.activeElement.blur();
      }

      const r = Number(td.getAttribute('data-r'));
      const c = Number(td.getAttribute('data-c'));

      if (e.shiftKey) {
        // Shift+Click: mở rộng từ ô neo hiện tại tới ô này, chọn 1 dải liên tục kiểu Excel
        extendSelection(r, c);
        isSelecting = false; // chỉ mở rộng đúng 1 lần khi bấm, không kéo chuột tiếp
      } else if (e.ctrlKey || e.metaKey) {
        // Ctrl+Click (Cmd+Click trên Mac): thêm/bớt đúng ô này, giữ nguyên các ô đã chọn trước
        toggleCellRegion(r, c);
        isSelecting = false;
      } else {
        // Bấm thường: bỏ chọn cũ, bắt đầu chọn mới, vẫn cho phép kéo chuột để chọn 1 dải
        isSelecting = true;
        selectSingle(r, c);
      }
      // Chỉ chặn hành vi bôi đen chữ mặc định khi bấm vào ô "trơn" (không phải checkbox/ô ghi chú)
      if (e.target.tagName === 'TD') e.preventDefault();
    });

    document.getElementById('result').addEventListener('mouseover', function(e) {
      if (!isSelecting) return;
      const td = e.target.closest('td[data-r]');
      if (!td) return;
      extendSelection(Number(td.getAttribute('data-r')), Number(td.getAttribute('data-c')));
    });

    document.addEventListener('mouseup', function() { isSelecting = false; });

    // Cuộn gần tới đáy khu vực kết quả -> tự dựng thêm dòng tiếp theo (thay vì dựng
    // sẵn toàn bộ hàng chục nghìn dòng ngay từ đầu, gây đơ trình duyệt).
    document.getElementById('result').addEventListener('scroll', function() {
      const el = document.getElementById('result');
      const nearBottom = el.scrollTop + el.clientHeight >= el.scrollHeight - 400;
      if (nearBottom) renderMoreRows_();
    });

    document.addEventListener('keydown', function(e) {
      // Nếu đang gõ trong ô Ghi chú, để handleNoteKeydown tự lo (Enter/Ctrl+Enter/Esc)
      if (e.target.tagName === 'TEXTAREA') {
        if (e.key === 'Escape') clearSelection();
        return;
      }
      // Đang gõ/dán trong bất kỳ ô input nào (ô tìm kiếm, ô lọc...) -> để trình duyệt tự lo
      // copy/paste bình thường, KHÔNG cho phím tắt của bảng (Ctrl+C/V/X/D/R) chặn mất.
      if (e.target.tagName === 'INPUT') {
        return;
      }
      // Đang tìm kiếm mà bấm Esc -> hủy ngay, không cần đang focus vào ô nhập
      if (e.key === 'Escape' && isSearching) {
        cancelSearch();
        e.preventDefault();
        return;
      }
      if (selAnchorR < 0) return;

      const maxR = displayedRows.length - 1;
      const maxC = COLUMNS.length - 1;
      let handled = true;

      if (e.key === 'ArrowDown' || (e.key === 'Enter' && !e.ctrlKey)) {
        selectSingle(Math.min(selAnchorR + 1, maxR), selAnchorC);
      } else if (e.key === 'ArrowUp') {
        selectSingle(Math.max(selAnchorR - 1, 0), selAnchorC);
      } else if (e.key === 'ArrowLeft') {
        selectSingle(selAnchorR, Math.max(selAnchorC - 1, 0));
      } else if (e.key === 'ArrowRight' || e.key === 'Tab') {
        selectSingle(selAnchorR, Math.min(selAnchorC + 1, maxC));
      } else if (e.key === 'Escape') {
        clearSelection();
      } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'c') {
        copySelection();
      } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'x') {
        copySelection();
        clearSelectionValues();
      } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'v') {
        pasteSelection();
      } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'd') {
        fillDown();
      } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'r') {
        fillRight();
      } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
        performUndo();
      } else {
        handled = false;
      }

      if (handled) e.preventDefault();
    });

    /* ---------- Copy / Paste / Cut / Fill (clipboard nội bộ trong app) ---------- */

    function getCellRawValue_(rIdx, cIdx) {
      const row = displayedRows[rIdx];
      const col = COLUMNS[cIdx];
      if (!row || !col) return '';
      return row[col.key];
    }

    function copySelection() {
      const rect = cellRect();
      if (rect.r2 < rect.r1) return; // không có gì đang chọn
      const data = [];
      const keys = [];
      for (let c = rect.c1; c <= rect.c2; c++) keys.push(COLUMNS[c].key);
      for (let r = rect.r1; r <= rect.r2; r++) {
        const rowVals = [];
        for (let c = rect.c1; c <= rect.c2; c++) {
          // Chọn rời rạc bằng Ctrl+Click: ô nằm trong khung bao nhưng KHÔNG thực sự được
          // chọn thì để trống khi copy, giống Excel khi copy vùng chọn không liền khối.
          rowVals.push(isCellSelected(r, c) ? getCellRawValue_(r, c) : '');
        }
        data.push(rowVals);
      }
      appClipboard = { data: data, keys: keys };

      // Đồng thời copy ra clipboard thật của máy (dạng TSV) để dán sang Excel, Zalo, Sheet khác...
      // Mỗi dòng cách nhau bằng \n, mỗi cột cách nhau bằng \t -> dán vào Excel/Sheet sẽ tự tách đúng ô,
      // ô trống vẫn giữ nguyên vị trí trống (giống hành vi copy trong Excel).
      const tsvText = data.map(function(rowVals) {
        return rowVals.map(function(v) {
          if (v === null || v === undefined) return '';
          if (typeof v === 'boolean') return v ? 'TRUE' : 'FALSE';
          return String(v);
        }).join('\t');
      }).join('\n');

      writeToRealClipboard_(tsvText);
    }

    // Ghi ra clipboard thật của hệ điều hành. Thử Clipboard API trước (nhanh, hiện đại),
    // nếu bị chặn (thường gặp trong iframe của Apps Script) thì tự chuyển sang cách cũ
    // dùng textarea ẩn + execCommand('copy') để vẫn copy được.
    function writeToRealClipboard_(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).catch(function() {
          fallbackCopy_(text);
        });
      } else {
        fallbackCopy_(text);
      }
    }

    function fallbackCopy_(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      ta.style.top = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try {
        document.execCommand('copy');
      } catch (e) {
        /* trình duyệt không hỗ trợ, đành chịu im lặng */
      }
      document.body.removeChild(ta);
    }

    function setCellValue_(rIdx, colKey, value, recordUndo) {
      if (recordUndo === undefined) recordUndo = true;
      const row = displayedRows[rIdx];
      if (!row) return;
      const lsxStt = row.lsx_stt;
      const tr = document.querySelector('#result tr[data-lsxstt="' + String(lsxStt).replace(/"/g,'\\"') + '"]');
      const cIdx = COLUMNS.findIndex(function(c){ return c.key === colKey; });
      const td = tr ? tr.cells[cIdx] : null;

      if (colKey === 'ghi_chu') {
        const ta = td ? td.querySelector('.row-note') : null;
        if (ta) { ta.value = value || ''; autoGrowNote(ta); onNoteChange(ta, recordUndo); }
      } else if (BOOL_KEYS.indexOf(colKey) !== -1) {
        const cb = td ? td.querySelector('.row-chk') : null;
        const boolVal = (value === true || value === 'true' || value === 'TRUE' || value === '1');
        if (cb) { cb.checked = boolVal; onBoolChange(cb, colKey, recordUndo); }
      }
      // Các cột không thuộc EDITABLE_KEYS: bỏ qua, không cho ghi đè dữ liệu gốc từ app
    }

    // Cập nhật 1 ô CHỈ ở phía giao diện + dữ liệu cục bộ, KHÔNG gọi server ngay.
    // Dùng khi thao tác hàng loạt (dán/fill/xóa) để gom nhiều ô thành 1 lệnh lưu duy nhất
    // thay vì gọi google.script.run riêng lẻ cho từng ô -> nhanh hơn nhiều với vùng chọn lớn.
    function applyCellLocal_(rIdx, colKey, value) {
      const row = displayedRows[rIdx];
      if (!row) return null;
      const lsxStt = row.lsx_stt;
      const tr = document.querySelector('#result tr[data-lsxstt="' + String(lsxStt).replace(/"/g,'\\"') + '"]');
      const cIdx = COLUMNS.findIndex(function(c){ return c.key === colKey; });
      const td = tr ? tr.cells[cIdx] : null;
      const dataRow = findRowData(lsxStt);
      let finalValue = value;

      if (colKey === 'ghi_chu') {
        finalValue = value || '';
        const ta = td ? td.querySelector('.row-note') : null;
        if (ta) { ta.value = finalValue; ta.setAttribute('data-old', finalValue); autoGrowNote(ta); }
        if (dataRow) dataRow.ghi_chu = finalValue;
      } else if (BOOL_KEYS.indexOf(colKey) !== -1) {
        finalValue = (value === true || value === 'true' || value === 'TRUE' || value === '1');
        const cb = td ? td.querySelector('.row-chk') : null;
        if (cb) cb.checked = finalValue;
        if (dataRow) dataRow[colKey] = finalValue;
      } else {
        return null; // cột không cho phép sửa
      }

      return { lsxStt: lsxStt, field: colKey, value: finalValue, sheetRow: dataRow ? dataRow.thu_tu : null };
    }

    // Gửi 1 lệnh duy nhất xuống server để lưu nhiều ô cùng lúc.
    function batchSave_(items) {
      if (!items || items.length === 0) return;
      items.forEach(function(it) { pendingSaves.add(pendingKey_(it.lsxStt, it.field)); });
      updateSummary(lastRows);

      google.script.run
        .withSuccessHandler(function() {
          items.forEach(function(it) { pendingSaves.delete(pendingKey_(it.lsxStt, it.field)); });
          showToast('Đã lưu ' + items.length + ' ô.', 'success');
          refreshSyncStatus();
        })
        .withFailureHandler(function(err) {
          items.forEach(function(it) { pendingSaves.delete(pendingKey_(it.lsxStt, it.field)); });
          showToast('Lưu thất bại (' + items.length + ' ô): ' + err.message, 'error');
        })
        .updateBomFieldsBatch(items);
    }

    function pasteSelection() {
      if (!appClipboard) return;
      const rect = cellRect();
      const srcRows = appClipboard.data.length;
      const srcCols = appClipboard.keys.length;
      const targetRows = Math.max(rect.r2 - rect.r1 + 1, srcRows);
      const targetCols = Math.max(rect.c2 - rect.c1 + 1, srcCols);

      const undoEntries = [];
      const applyList = [];

      for (let i = 0; i < targetRows; i++) {
        const r = rect.r1 + i;
        if (r > displayedRows.length - 1) break;
        for (let j = 0; j < targetCols; j++) {
          const c = rect.c1 + j;
          if (c > COLUMNS.length - 1) break;
          const colKey = COLUMNS[c].key;
          if (EDITABLE_KEYS.indexOf(colKey) === -1) continue;
          const value = appClipboard.data[i % srcRows][j % srcCols];
          const row = displayedRows[r];
          undoEntries.push({ lsxStt: row.lsx_stt, field: colKey, oldValue: row[colKey] });
          applyList.push({ r: r, colKey: colKey, value: value });
        }
      }

      pushUndo(undoEntries);
      const saveItems = applyList.map(function(item) { return applyCellLocal_(item.r, item.colKey, item.value); })
        .filter(function(x) { return x; });
      batchSave_(saveItems);
    }

    function clearSelectionValues() {
      const rect = cellRect();
      const undoEntries = [];
      const applyList = [];

      for (let r = rect.r1; r <= rect.r2; r++) {
        for (let c = rect.c1; c <= rect.c2; c++) {
          const colKey = COLUMNS[c].key;
          if (EDITABLE_KEYS.indexOf(colKey) === -1) continue;
          const row = displayedRows[r];
          const newValue = BOOL_KEYS.indexOf(colKey) !== -1 ? false : '';
          undoEntries.push({ lsxStt: row.lsx_stt, field: colKey, oldValue: row[colKey] });
          applyList.push({ r: r, colKey: colKey, value: newValue });
        }
      }

      pushUndo(undoEntries);
      const saveItems = applyList.map(function(item) { return applyCellLocal_(item.r, item.colKey, item.value); })
        .filter(function(x) { return x; });
      batchSave_(saveItems);
    }

    function fillDown() {
      const rect = cellRect();
      if (rect.r1 === rect.r2) return;
      const undoEntries = [];
      const applyList = [];

      for (let c = rect.c1; c <= rect.c2; c++) {
        const colKey = COLUMNS[c].key;
        if (EDITABLE_KEYS.indexOf(colKey) === -1) continue;
        const sourceValue = getCellRawValue_(rect.r1, c);
        for (let r = rect.r1 + 1; r <= rect.r2; r++) {
          const row = displayedRows[r];
          undoEntries.push({ lsxStt: row.lsx_stt, field: colKey, oldValue: row[colKey] });
          applyList.push({ r: r, colKey: colKey, value: sourceValue });
        }
      }

      pushUndo(undoEntries);
      const saveItems = applyList.map(function(item) { return applyCellLocal_(item.r, item.colKey, item.value); })
        .filter(function(x) { return x; });
      batchSave_(saveItems);
    }

    function fillRight() {
      const rect = cellRect();
      if (rect.c1 === rect.c2) return;
      const undoEntries = [];
      const applyList = [];

      for (let r = rect.r1; r <= rect.r2; r++) {
        const sourceValue = getCellRawValue_(r, rect.c1);
        for (let c = rect.c1 + 1; c <= rect.c2; c++) {
          const colKey = COLUMNS[c].key;
          if (EDITABLE_KEYS.indexOf(colKey) === -1) continue;
          const row = displayedRows[r];
          undoEntries.push({ lsxStt: row.lsx_stt, field: colKey, oldValue: row[colKey] });
          applyList.push({ r: r, colKey: colKey, value: sourceValue });
        }
      }

      pushUndo(undoEntries);
      const saveItems = applyList.map(function(item) { return applyCellLocal_(item.r, item.colKey, item.value); })
        .filter(function(x) { return x; });
      batchSave_(saveItems);
    }

    /* ================= MÀN HÌNH CHỜ KHI MỞ APP ================= */
    let splashProgress = 0;
    let splashTimer = null;
    let splashStepsDone = 0;
    let splashFinished = false;
    const SPLASH_TOTAL_STEPS = 2; // 1: giao diện đã dựng xong, 2: đã lấy được thời gian đồng bộ gần nhất

    function showGreeting_() {
      const hour = new Date().getHours();
      let text;
      if (hour >= 5 && hour < 11) text = 'Chào buổi sáng!';
      else if (hour >= 11 && hour < 13) text = 'Chào buổi trưa!';
      else if (hour >= 13 && hour < 18) text = 'Chào buổi chiều!';
      else text = 'Chào buổi tối!';
      const el = document.getElementById('splashGreeting');
      if (el) el.textContent = text;
    }

    function startSplashProgress_() {
      splashProgress = 0;
      splashTimer = setInterval(function() {
        // Tăng dần tới tối đa 85% bằng hiệu ứng giả lập, chờ các bước tải THẬT xong
        // mới đẩy nốt lên 100% - để thanh tiến trình luôn có cảm giác đang chạy thay
        // vì đứng yên trong lúc chờ phản hồi server.
        if (splashProgress < 85) {
          splashProgress = Math.min(85, splashProgress + Math.random() * 8 + 4);
          updateSplashUI_(Math.round(splashProgress), 'Đang tải dữ liệu...');
        }
      }, 150);
    }

    function updateSplashUI_(percent, label) {
      const bar = document.getElementById('splashBarFill');
      const pct = document.getElementById('splashPercent');
      const lbl = document.getElementById('splashLabel');
      if (bar) bar.style.width = percent + '%';
      if (pct) pct.textContent = percent + '%';
      if (lbl && label) lbl.textContent = label;
    }

    function splashStepDone_() {
      splashStepsDone++;
      if (splashStepsDone >= SPLASH_TOTAL_STEPS) finishSplash_();
    }

    function finishSplash_() {
      if (splashFinished) return;
      splashFinished = true;
      if (splashTimer) { clearInterval(splashTimer); splashTimer = null; }
      updateSplashUI_(100, 'Hoàn tất!');
      setTimeout(function() {
        const overlay = document.getElementById('splashOverlay');
        if (!overlay) return;
        overlay.style.opacity = '0';
        setTimeout(function() { overlay.style.display = 'none'; }, 300);
      }, 250);
    }

    /* ================= TRẠNG THÁI ĐỒNG BỘ SHEET -> SUPABASE ================= */
    let initialSyncLoaded = false;
    const SYNC_STATUS_REFRESH_MS = 30000; // 30 giây tự làm mới 1 lần

    function renderSyncStatus_(iso) {
      const el = document.getElementById('syncStatus');
      if (!el) return;
      if (!iso) { el.innerHTML = '<span class="sync-dot" style="background:#bbb;"></span>Chưa có dữ liệu đồng bộ'; return; }
      const d = new Date(iso);
      const hh = String(d.getHours()).padStart(2, '0');
      const mm = String(d.getMinutes()).padStart(2, '0');
      const ss = String(d.getSeconds()).padStart(2, '0');
      el.innerHTML = '<span class="sync-dot"></span>Cập nhật ' + hh + ':' + mm + ':' + ss;
    }

    function refreshSyncStatus() {
      google.script.run
        .withSuccessHandler(function(iso) {
          renderSyncStatus_(iso);
          if (!initialSyncLoaded) { initialSyncLoaded = true; splashStepDone_(); }
        })
        .withFailureHandler(function() {
          // Im lặng bỏ qua, lần làm mới sau (30s) sẽ tự thử lại. Vẫn phải đóng màn
          // hình chờ dù lỗi, tránh treo mãi mãi nếu server không phản hồi được.
          if (!initialSyncLoaded) { initialSyncLoaded = true; splashStepDone_(); }
        })
        .getLastSyncTime();
    }

    // Phòng trường hợp getLastSyncTime() không phản hồi vì lý do bất thường nào đó
    // (mất mạng, server treo...) - vẫn đóng màn hình chờ sau tối đa 8 giây, không để
    // người dùng bị kẹt mãi ở màn hình chờ.
    setTimeout(function() {
      if (!initialSyncLoaded) { initialSyncLoaded = true; splashStepDone_(); }
    }, 8000);

    showGreeting_();
    startSplashProgress_();
    renderCategoryButtons();
    renderEmptyTable();
    applySavedDisplayPrefs_();
    splashStepDone_(); // bước 1: giao diện đã dựng xong

      /* ================= SIDEBAR + TAB ================= */
    // Dữ liệu Nhận phôi / Giao hàng được tải 1 LẦN DUY NHẤT lúc mở app (xem loadInitialAppData_),
    // nên chuyển tab chỉ cần render lại từ mảng đã có sẵn - KHÔNG gọi server nữa.
    let nhanPhoiRows = [];
    let giaoHangRows = [];
    const trackingFilters = { nhanphoi: {}, giaohang: {} }; // giống `filters` của bảng Check đơn hàng
    let activeFilterTarget = 'bom'; // 'bom' | 'nhanphoi' | 'giaohang' - popup lọc nào đang mở

    let activeTrackingTab_ = null; // 'nhanphoi' | 'giaohang' | null - tab đang mở, để biết polling cái gì
    let trackingPollTimer_ = null;
    const TRACKING_POLL_INTERVAL_MS = 10000; // 10 giây tự làm mới 1 lần cho mọi người cùng xem

    function switchTab(tabId) {
      document.querySelectorAll('.tab-pane').forEach(function(el) { el.classList.remove('active'); });
      // Bỏ active ở CẢ sidebar (desktop) lẫn bottom nav (mobile) - trước đây chỉ
      // cập nhật sidebar nên trên mobile bấm tab không hiện trạng thái đang chọn.
      document.querySelectorAll('.sidebar-nav-btn, .mobile-nav-btn').forEach(function(el) { el.classList.remove('active'); });
      document.getElementById(tabId).classList.add('active');
      document.querySelectorAll('[data-tab="' + tabId + '"]').forEach(function(el) { el.classList.add('active'); });

      if (tabId === 'tab-nhanphoi') {
        activeTrackingTab_ = 'nhanphoi';
        renderTrackingTable_('nhanPhoiResult', applyTrackingFilters_(nhanPhoiRows, trackingFilters.nhanphoi), 'nhanphoi');
        if (!trackingLoaded.nhanphoi) refreshNhanPhoiTab(); // lỡ dữ liệu ban đầu chưa tải xong -> âm thầm tải bù
      } else if (tabId === 'tab-giaohang') {
        activeTrackingTab_ = 'giaohang';
        renderTrackingTable_('giaoHangResult', applyTrackingFilters_(giaoHangRows, trackingFilters.giaohang), 'giaohang');
        if (!trackingLoaded.giaohang) refreshGiaoHangTab();
      } else {
        activeTrackingTab_ = null;
      }

      startTrackingPolling_();
    }

    function startTrackingPolling_() {
      if (trackingPollTimer_) { clearInterval(trackingPollTimer_); trackingPollTimer_ = null; }
      if (!activeTrackingTab_) return;
      trackingPollTimer_ = setInterval(pollActiveTrackingTab_, TRACKING_POLL_INTERVAL_MS);
    }

    // Âm thầm tải lại dữ liệu của đúng tab đang mở, không hiện spinner/toast để không
    // làm phiền - chỉ cập nhật bảng nếu có gì thay đổi so với dữ liệu đang hiển thị.
    function pollActiveTrackingTab_() {
      if (!activeTrackingTab_) return;
      if (activeTrackingTab_ === 'nhanphoi') {
        google.script.run
          .withSuccessHandler(function(rows) {
            nhanPhoiRows = rows;
            renderTrackingTable_('nhanPhoiResult', applyTrackingFilters_(rows, trackingFilters.nhanphoi), 'nhanphoi');
          })
          .withFailureHandler(function() { /* im lặng bỏ qua, lần sau tự thử lại */ })
          .getNhanPhoiData();
      } else if (activeTrackingTab_ === 'giaohang') {
        google.script.run
          .withSuccessHandler(function(rows) {
            giaoHangRows = rows;
            renderTrackingTable_('giaoHangResult', applyTrackingFilters_(rows, trackingFilters.giaohang), 'giaohang');
          })
          .withFailureHandler(function() {})
          .getGiaoHangData();
      }
    }

    function toggleSidebar() {
      document.getElementById('mainSidebar').classList.toggle('collapsed');
    }

        function onDarkModeToggle_(isDark) {
      document.body.classList.toggle('dark-mode', isDark);
      try { localStorage.setItem('gcck_dark_mode', isDark ? '1' : '0'); } catch (e) {}
    }

    function onZoomChange_(percent) {
      document.getElementById('zoomValueLabel').textContent = percent + '%';
      document.querySelector('.app-layout').style.zoom = (percent / 100);
      try { localStorage.setItem('gcck_zoom', percent); } catch (e) {}
    }

    function applySavedDisplayPrefs_() {
      let dark = '0', zoom = '100';
      try {
        dark = localStorage.getItem('gcck_dark_mode') || '0';
        zoom = localStorage.getItem('gcck_zoom') || '100';
      } catch (e) {}
      document.getElementById('darkModeToggle').checked = (dark === '1');
      document.body.classList.toggle('dark-mode', dark === '1');
      document.getElementById('zoomSlider').value = zoom;
      document.getElementById('zoomValueLabel').textContent = zoom + '%';
      document.querySelector('.app-layout').style.zoom = (Number(zoom) / 100);
    }

    function getFilterDataset_() {
      if (activeFilterTarget === 'nhanphoi') return { rows: nhanPhoiRows, filters: trackingFilters.nhanphoi };
      if (activeFilterTarget === 'giaohang') return { rows: giaoHangRows, filters: trackingFilters.giaohang };
      return { rows: lastRows, filters: filters };
    }

    function applyTrackingFilters_(rows, filtersObj) {
      return rows.filter(function(r) {
        for (const key in filtersObj) {
          const allowed = filtersObj[key];
          if (!allowed) continue;
          if (!allowed.has(normalizeValue(key, r[key]))) return false;
        }
        return true;
      });
    }

        /* ================= BẢNG NHẬN PHÔI / GIAO HÀNG ================= */
    function getTrackingColumns_(target) {
      const nguoiLabel = target === 'giaohang' ? 'Người giao' : 'Người nhận';
      return [
        { key: 'lsx_stt', label: 'LSX-STT' },
        { key: 'lsx', label: 'Lệnh sản xuất' },
        { key: 'stt', label: 'STT' },
        { key: 'msct', label: 'MSCT' },
        { key: 'ten_chi_tiet', label: 'Tên chi tiết' },
        { key: 'vat_lieu', label: 'Vật liệu' },
        { key: 'dai', label: 'Dài' },
        { key: 'rong', label: 'Rộng' },
        { key: 'day', label: 'Dày' },
        { key: 'hinh_hop', label: 'Hình/hộp' },
        { key: 'dn', label: 'Dn' },
        { key: 'dt', label: 'Dt' },
        { key: 'sl_dh', label: 'SL/ĐH' },
        { key: 'so_luong', label: 'SL' },
        { key: 'nguoi', label: nguoiLabel },
        { key: 'ngay', label: 'Ngày' }
      ];
    }

    function buildTrackingHeaderRow_(target) {
      const cols = getTrackingColumns_(target);
      const filtersObj = target === 'nhanphoi' ? trackingFilters.nhanphoi : trackingFilters.giaohang;
      let row = '<tr>';
      cols.forEach(function(col) {
        const activeCls = filtersObj[col.key] ? ' active' : '';
        row += '<th>' + col.label +
          '<span class="filter-icon' + activeCls + '" onclick="openFilterPopup(\'' + col.key + '\', this, \'' + target + '\')">&#9662;</span>' +
          '</th>';
      });
      row += '</tr>';
      return row;
    }

    // rows truyền vào LUÔN là dữ liệu ĐÃ LỌC (kết quả applyTrackingFilters_).
    function renderTrackingTable_(containerId, rows, target) {
      const cols = getTrackingColumns_(target);
      const el = document.getElementById(containerId);
      let html = '<table>' + buildTrackingHeaderRow_(target);
      if (!rows || rows.length === 0) {
        html += '<tr><td colspan="' + cols.length + '" class="empty-state-cell">Chưa có dữ liệu.</td></tr>';
      } else {
        rows.forEach(function(r) {
          html += '<tr data-lsxstt="' + String(r.lsx_stt).replace(/"/g, '&quot;') + '">';
          cols.forEach(function(c) {
            const v = r[c.key];
            html += '<td data-label="' + c.label + '">' + (v === null || v === undefined ? '' : v) + '</td>';
          });
          html += '</tr>';
        });
      }
      html += '</table>';
      el.innerHTML = html;
    }

    /* ================= MODAL NHẬN PHÔI / GIAO HÀNG + QR ================= */
    const WORKER_NAMES = ['Ngô Duy Đông','Trần Minh Chí','Nguyễn Dương','Nguyễn Thanh Nam','Phạm Thị Chiến','Bùi Ngọc Lưu','Khác'];

    let trackingMode = 'nhanphoi';
    let trackingPendingList = [];
    let qrScanner_ = null;

    let autoFillReqId_ = 0;
    let currentAutoFillDetail_ = null; // toàn bộ quy cách tra được lần gần nhất, gửi kèm khi lưu

    function autoFillTrackingDetail_() {
      const lsx = document.getElementById('trackLsxInput').value.trim();
      const stt = document.getElementById('trackSttInput').value.trim();
      if (!lsx || !stt) return;
      const myId = ++autoFillReqId_;
      google.script.run
        .withSuccessHandler(function(detail) {
          if (myId !== autoFillReqId_) return;
          currentAutoFillDetail_ = detail || null;
          if (!detail) return;
          if (detail.msct) document.getElementById('trackMsctInput').value = detail.msct;
          if (detail.ten_chi_tiet) document.getElementById('trackTenCtInput').value = detail.ten_chi_tiet;
        })
        .withFailureHandler(function() { currentAutoFillDetail_ = null; })
        .lookupBomDetailForTracking(lsx, stt);
    }

    function onTrackNguoiChange_() {
      const sel = document.getElementById('trackNguoiSelect');
      document.getElementById('trackNguoiOther').style.display = (sel.value === 'Khác') ? 'block' : 'none';
    }

    function getSelectedNguoi_() {
      const sel = document.getElementById('trackNguoiSelect');
      if (sel.value === 'Khác') return document.getElementById('trackNguoiOther').value.trim();
      return sel.value;
    }

    function openTrackingModal(mode) {
      trackingMode = mode;
      trackingPendingList = [];
      currentAutoFillDetail_ = null;

      document.getElementById('trackingModalTitle').textContent = mode === 'nhanphoi' ? 'Nhận phôi' : 'Giao hàng';
      document.getElementById('trackQtyLabel').innerHTML = (mode === 'nhanphoi' ? 'SL nhận' : 'SL Giao') +
        '<input type="number" id="trackQtyInput" min="1" style="width:100%; padding:8px; box-sizing:border-box; font-size:15px;" />';
      document.getElementById('trackLsxInput').value = '';
      document.getElementById('trackSttInput').value = '';
      document.getElementById('trackMsctInput').value = '';
      document.getElementById('trackTenCtInput').value = '';
      document.getElementById('trackOrderQtyInput').value = '';

      const sel = document.getElementById('trackNguoiSelect');
      sel.innerHTML = WORKER_NAMES.map(function(n) { return '<option value="' + n + '">' + n + '</option>'; }).join('');
      document.getElementById('trackNguoiOther').style.display = 'none';
      document.getElementById('trackNguoiOther').value = '';

      renderTrackingPendingList_();
      document.getElementById('trackingOverlay').style.display = 'flex';
    }

    function closeTrackingModal() {
      stopQrScan_();
      document.getElementById('trackingOverlay').style.display = 'none';
    }

    function renderTrackingPendingList_() {
      const wrap = document.getElementById('trackingPendingWrap');
      const body = document.getElementById('trackingPendingBody');
      const saveBtn = document.getElementById('trackSaveBtn');

      if (trackingPendingList.length === 0) {
        wrap.style.display = 'none';
        saveBtn.textContent = 'Lưu';
        return;
      }
      wrap.style.display = 'block';
      saveBtn.textContent = 'Lưu tất cả (' + trackingPendingList.length + ')';
      body.innerHTML = trackingPendingList.map(function(item, i) {
        return '<tr>' +
          '<td style="border:1px solid #ddd; padding:4px;">' + item.lsx + '</td>' +
          '<td style="border:1px solid #ddd; padding:4px;">' + item.stt + '</td>' +
          '<td style="border:1px solid #ddd; padding:4px;">' + (item.tenChiTiet || '') + '</td>' +
          '<td style="border:1px solid #ddd; padding:4px;">' + item.soLuong + '</td>' +
          '<td style="border:1px solid #ddd; padding:4px; cursor:pointer; color:#c62828;" onclick="removeFromTrackingList_(' + i + ')">&times;</td>' +
          '</tr>';
      }).join('');
    }

    function removeFromTrackingList_(idx) {
      trackingPendingList.splice(idx, 1);
      renderTrackingPendingList_();
    }

    function addToTrackingList_() {
      const lsx = document.getElementById('trackLsxInput').value.trim();
      const stt = document.getElementById('trackSttInput').value.trim();
      const msct = document.getElementById('trackMsctInput').value.trim();
      const tenChiTiet = document.getElementById('trackTenCtInput').value.trim();
      const qtyInput = document.getElementById('trackQtyInput');
      const sl = Number(qtyInput ? qtyInput.value.trim() : '');
      const nguoi = getSelectedNguoi_();

      if (!lsx || !stt || !sl || sl <= 0) {
        showToast('Vui lòng nhập đầy đủ Lệnh sản xuất, STT và số lượng hợp lệ.', 'error');
        return;
      }
      if (!nguoi) {
        showToast('Vui lòng chọn/nhập người thực hiện.', 'error');
        return;
      }

      // Mang theo TOÀN BỘ quy cách đã tra được (nếu có) - phòng trường hợp server tra
      // lại không khớp (VD gõ tắt khác cách BOM lưu), vẫn còn dữ liệu dự phòng để hiển
      // thị đúng ngay trên bảng, không phải đợi làm mới.
      const detail = currentAutoFillDetail_;
      const extra = detail ? {
        vatLieu: detail.vat_lieu, dai: detail.dai, rong: detail.rong, day: detail.day,
        hinhHop: detail.hinh_hop, dn: detail.dn, dt: detail.dt, slDh: detail.sl_dh
      } : {};

      // Trùng LSX+STT trong danh sách đang chờ -> cộng dồn số lượng thay vì thêm dòng mới.
      const existing = trackingPendingList.find(function(it) { return it.lsx === lsx && it.stt === stt; });
      if (existing) {
        existing.soLuong += sl;
        existing.nguoi = nguoi;
        if (msct) existing.msct = msct;
        if (tenChiTiet) existing.tenChiTiet = tenChiTiet;
        Object.assign(existing, extra);
      } else {
        trackingPendingList.push(Object.assign({ lsx: lsx, stt: stt, soLuong: sl, nguoi: nguoi, msct: msct, tenChiTiet: tenChiTiet }, extra));
      }
      currentAutoFillDetail_ = null;

      document.getElementById('trackLsxInput').value = '';
      document.getElementById('trackSttInput').value = '';
      document.getElementById('trackMsctInput').value = '';
      document.getElementById('trackTenCtInput').value = '';
      document.getElementById('trackOrderQtyInput').value = '';
      qtyInput.value = '';
      // Không tự focus lại ô LSX nữa - tránh tự bật bàn phím/phóng to màn hình
      // trên mobile ngay sau khi thêm 1 món vào danh sách chờ lưu.
      if (document.activeElement) document.activeElement.blur();
      renderTrackingPendingList_();
    }

    function startQrScan_() {
      document.getElementById('qrReaderWrap').style.display = 'block';
      document.getElementById('qrScanBtn').style.display = 'none';
      qrScanner_ = new Html5Qrcode('qrReader');
      qrScanner_.start(
        { facingMode: 'environment' },
        { fps: 10, qrbox: 220 },
        onQrScanSuccess_,
        function() { /* lỗi từng khung hình, bỏ qua */ }
      ).catch(function(err) {
        showToast('Không mở được camera: ' + err, 'error');
        stopQrScan_();
      });
    }

    function stopQrScan_() {
      document.getElementById('qrReaderWrap').style.display = 'none';
      document.getElementById('qrScanBtn').style.display = 'block';
      if (qrScanner_) {
        qrScanner_.stop().then(function() { qrScanner_.clear(); }).catch(function() {});
        qrScanner_ = null;
      }
    }

    // QR trên phiếu hiện tại dạng "LSX | STT | ... " -> tách theo "|". Nếu QR thực tế khác
    // format, chỉnh lại 2 dòng gán bên dưới cho khớp.
    function onQrScanSuccess_(decodedText) {
      const parts = decodedText.split('|').map(function(s) { return s.trim(); });
      if (parts[0]) document.getElementById('trackLsxInput').value = parts[0];
      if (parts[1]) document.getElementById('trackSttInput').value = parts[1];
      if (parts[2]) document.getElementById('trackMsctInput').value = parts[2];
      if (parts[3]) document.getElementById('trackTenCtInput').value = parts[3];
      if (parts[4]) {
        document.getElementById('trackOrderQtyInput').value = parts[4];
        const qtyInput = document.getElementById('trackQtyInput');
        if (qtyInput) qtyInput.value = parts[4]; // mặc định = SL đơn hàng, vẫn sửa được tay
      }
      stopQrScan_();
      showToast('Đã đọc mã QR, kiểm tra lại thông tin trước khi thêm vào danh sách.', 'success');
    }

    function todayDisplayStr_() {
      const d = new Date();
      const dd = String(d.getDate()).padStart(2, '0');
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const yy = String(d.getFullYear()).slice(-2);
      return dd + '/' + mm + '/' + yy;
    }

    function saveTrackingBatch_() {
      if (document.activeElement) document.activeElement.blur(); // đóng bàn phím ngay khi bấm Lưu
      // Nếu đang có dữ liệu trong 3 ô nhập mà CHƯA bấm "Thêm vào danh sách" -> tự thêm nốt,
      // để lưu đúng 1 món cũng không cần thao tác thừa.
      const lsx = document.getElementById('trackLsxInput').value.trim();
      const stt = document.getElementById('trackSttInput').value.trim();
      const qtyInput = document.getElementById('trackQtyInput');
      const slRaw = qtyInput ? qtyInput.value.trim() : '';
      if (lsx && stt && slRaw) addToTrackingList_();

      if (trackingPendingList.length === 0) {
        showToast('Chưa có dữ liệu để lưu.', 'error');
        return;
      }

      const mode = trackingMode;
      const items = trackingPendingList.slice();
      const rowsArr = mode === 'nhanphoi' ? nhanPhoiRows : giaoHangRows;
      const containerId = mode === 'nhanphoi' ? 'nhanPhoiResult' : 'giaoHangResult';
      const filtersObj = mode === 'nhanphoi' ? trackingFilters.nhanphoi : trackingFilters.giaohang;
      const todayDisplay = todayDisplayStr_();

      // 1. CẬP NHẬT GIAO DIỆN NGAY (lạc quan) cho TỪNG món trong danh sách.
      items.forEach(function(item) {
        const lsxStt = item.lsx + '-' + item.stt;
        let existing = rowsArr.find(function(r) { return r.lsx_stt === lsxStt; });
        if (existing) {
          existing.so_luong = (Number(existing.so_luong) || 0) + item.soLuong;
          existing.nguoi = item.nguoi;
          existing.ngay = todayDisplay;
          if (item.msct) existing.msct = item.msct;
          if (item.tenChiTiet) existing.ten_chi_tiet = item.tenChiTiet;
        } else {
          rowsArr.unshift({
            lsx_stt: lsxStt, lsx: item.lsx, stt: item.stt,
            msct: item.msct || '', ten_chi_tiet: item.tenChiTiet || '', vat_lieu: item.vatLieu || '',
            dai: item.dai || '', rong: item.rong || '', day: item.day || '',
            hinh_hop: item.hinhHop || '', dn: item.dn || '', dt: item.dt || '', sl_dh: item.slDh || '',
            so_luong: item.soLuong, nguoi: item.nguoi, ngay: todayDisplay
          });
        }
      });
      renderTrackingTable_(containerId, applyTrackingFilters_(rowsArr, filtersObj), mode);
      closeTrackingModal();
      showToast('Đang lưu ' + items.length + ' món...', 'info');

      // 2. LƯU NGẦM PHÍA SAU - 1 LẦN GỌI DUY NHẤT cho cả lô + tải lại dữ liệu thật để bù chi tiết.
      const fnName = mode === 'nhanphoi' ? 'recordNhanPhoiBatch' : 'recordGiaoHangBatch';
      google.script.run
        .withSuccessHandler(function() {
          showToast('Đã lưu ' + items.length + ' món.', 'success');
          if (mode === 'nhanphoi') refreshNhanPhoiTab(); else refreshGiaoHangTab();
        })
        .withFailureHandler(function(err) {
          showToast('Lưu thất bại: ' + err.message, 'error');
          if (mode === 'nhanphoi') refreshNhanPhoiTab(); else refreshGiaoHangTab();
        })
        [fnName](items);
    }

        /* ================= IN DỮ LIỆU ĐANG LỌC ================= */
    function printFilteredTable() {
      if (!displayedRows || displayedRows.length === 0) {
        showToast('Không có dữ liệu để in.', 'error');
        return;
      }
      const cols = getVisibleColumns();
      let html = '<html><head><meta charset="utf-8"><title>In BOM</title><style>' +
        '* { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; color-adjust: exact !important; }' +
        'table{border-collapse:collapse;width:100%;font-family:Arial,sans-serif;font-size:11px;}' +
        'th,td{border:1px solid #999;padding:3px 5px;text-align:center;}' +
        'th{background:#003DA5 !important;color:#fff !important;font-weight:bold;}' +
        '@media print { @page { size: landscape; margin: 8mm; } }' +
        '</style></head><body>';
      html += '<table><thead><tr>';
      cols.forEach(function(col) { html += '<th>' + col.label + '</th>'; });
      html += '</tr></thead><tbody>';

      displayedRows.forEach(function(r) {

        });
        html += '</tr>';
      });

      html += '</tbody></table></body></html>';

      const win = window.open('', '_blank');
      win.document.write(html);
      win.document.close();
      win.onload = function() { win.print(); };

        /* ================= CHỤP ẢNH TOÀN BỘ DỮ LIỆU ĐANG LỌC ================= */
    function captureFilteredTable() {
      if (typeof html2canvas === 'undefined') {
        showToast('Chưa tải được thư viện chụp ảnh, vui lòng thử lại sau vài giây.', 'error');
        return;
      }
      if (!displayedRows || displayedRows.length === 0) {
        showToast('Không có dữ liệu để chụp.', 'error');
        return;
      }

      showToast('Đang tạo ảnh, vui lòng đợi...', 'info');

      const cols = getVisibleColumns();
      const wrapper = document.createElement('div');
      wrapper.style.position = 'fixed';
      wrapper.style.left = '-99999px';
      wrapper.style.top = '0';
      wrapper.style.background = '#fff';

      let html = '<table style="border-collapse:collapse;font-family:Arial,sans-serif;font-size:13px;">';
      html += '<tr>';
      cols.forEach(function(col) {
        html += '<th style="background:#003DA5;color:#fff;border:1px solid #ddd;padding:6px 8px;white-space:nowrap;">' + col.label + '</th>';
      });
      html += '</tr>';

      displayedRows.forEach(function(r) {
        html += '<tr>';
        cols.forEach(function(col) {
          let val;
          if (col.bool) val = r[col.key] ? '&#10003;' : '';
          else if (col.key === 'khgh') val = formatDate(r[col.key]);
          else val = (r[col.key] === null || r[col.key] === undefined) ? '' : escapeHtml_(String(r[col.key]));
          html += '<td style="border:1px solid #ddd;padding:6px 8px;white-space:nowrap;text-align:center;">' + val + '</td>';
        });
        html += '</tr>';
      });
      html += '</table>';

      wrapper.innerHTML = html;
      document.body.appendChild(wrapper);

      html2canvas(wrapper, { backgroundColor: '#ffffff', scale: 2 }).then(function(canvas) {
        document.body.removeChild(wrapper);

        // Tải file PNG như cũ
        const link = document.createElement('a');
        link.download = 'BOM_' + (currentQuery || 'export') + '.png';
        link.href = canvas.toDataURL('image/png');
        link.click();

        // Đồng thời copy ảnh vào clipboard để dán (Ctrl+V) trực tiếp cho xưởng gia công
        canvas.toBlob(function(blob) {
          if (!blob) return;
          if (navigator.clipboard && window.ClipboardItem) {
            navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })])
              .then(function() { showToast('Đã chụp ảnh và copy vào clipboard, dán (Ctrl+V) để gửi.', 'success'); })
              .catch(function() { showToast('Đã tải ảnh, nhưng không copy được vào clipboard (trình duyệt chặn).', 'info'); });
          } else {
            showToast('Đã tải ảnh (trình duyệt không hỗ trợ copy ảnh vào clipboard).', 'info');
          }
        }, 'image/png');
      }).catch(function(err) {
        document.body.removeChild(wrapper);
        showToast('Lỗi khi chụp ảnh: ' + err.message, 'error');
      });
    }

    /* ================= XUẤT EXCEL DỮ LIỆU ĐANG LỌC ================= */
    function excelColWidth_(col) {
      if (col.lockWidthWide) return 28;
      if (col.lockWidth) return 10;
      if (col.bool) return 6;
      if (col.key === 'ten_chi_tiet' || col.key === 'san_pham') return 24;
      if (col.key === 'ghi_chu' || col.key === 'ghi_chu_dmvt') return 22;
      if (col.key === 'lsx') return 14;
      return 12;
    }

    async function exportToExcel() {
      if (typeof ExcelJS === 'undefined') {
        showToast('Chưa tải được thư viện xuất Excel, vui lòng thử lại sau vài giây.', 'error');
        return;
      }
      if (!displayedRows || displayedRows.length === 0) {
        showToast('Không có dữ liệu để xuất.', 'error');
        return;
      }

      showToast('Đang tạo file Excel...', 'info');

      const cols = getVisibleColumns();
      const workbook = new ExcelJS.Workbook();
      const sheet = workbook.addWorksheet('BOM');

      sheet.columns = cols.map(function(col) {
        return { header: col.label, key: col.key, width: excelColWidth_(col) };
      });

      const headerRow = sheet.getRow(1);
      headerRow.eachCell(function(cell) {
        cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF003DA5' } };
        cell.font = { color: { argb: 'FFFFFFFF' }, bold: true };
        cell.alignment = { vertical: 'middle', horizontal: 'center' };
      });

      displayedRows.forEach(function(r) {
        const rowData = {};
        cols.forEach(function(col) {
          let val = r[col.key];
          if (col.bool) val = val ? 'X' : '';
          else if (col.key === 'khgh') val = formatDate(val);
          else val = (val === null || val === undefined) ? '' : val;
          rowData[col.key] = val;
        });
        const row = sheet.addRow(rowData);
        row.eachCell(function(cell) {
          cell.alignment = { vertical: 'middle', horizontal: 'center' };
        });
      });

      sheet.views = [{ state: 'frozen', ySplit: 1 }]; // cố định hàng header khi cuộn trong Excel

      const buffer = await workbook.xlsx.writeBuffer();
      const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'BOM_' + (currentQuery || 'export') + '.xlsx';
      link.click();
      URL.revokeObjectURL(url);
      showToast('Đã xuất file Excel.', 'success');
    }

        function refreshCurrentData() {
      const btn = document.getElementById('refreshBtn');
      btn.classList.add('spinning');
      btn.disabled = true;
      function stop() { btn.classList.remove('spinning'); btn.disabled = false; }

      const activeBtn = document.querySelector('.sidebar-nav-btn.active');
      const tabId = activeBtn ? activeBtn.getAttribute('data-tab') : 'tab-checkdon';

      if (tabId === 'tab-nhanphoi') {
        google.script.run
          .withSuccessHandler(function(rows) {
            nhanPhoiRows = rows;
            renderTrackingTable_('nhanPhoiResult', applyTrackingFilters_(rows, trackingFilters.nhanphoi), 'nhanphoi');
            stop();
          })
          .withFailureHandler(function(err) { showToast('Lỗi: ' + err.message, 'error'); stop(); })
          .getNhanPhoiData();
      } else if (tabId === 'tab-giaohang') {
        google.script.run
          .withSuccessHandler(function(rows) {
            giaoHangRows = rows;
            renderTrackingTable_('giaoHangResult', applyTrackingFilters_(rows, trackingFilters.giaohang), 'giaohang');
            stop();
          })
          .withFailureHandler(function(err) { showToast('Lỗi: ' + err.message, 'error'); stop(); })
          .getGiaoHangData();
      } else {
        if (!currentQuery) { stop(); return; }
        const runner = google.script.run
          .withSuccessHandler(function(rows) {
            lastRows = rows;
            render(applyFilters(rows));
            refreshSyncStatus();
            stop();
          })
          .withFailureHandler(function(err) { showToast('Lỗi: ' + err.message, 'error'); stop(); });
        if (currentQueryMode === 'prefix') runner.searchByPrefix(currentQuery);
        else runner.searchByLSX(currentQuery);
      }
    }

    function loadInitialAppData_() {
      google.script.run
        .withSuccessHandler(function(data) {
          renderSyncStatus_(data.lastSyncTime);
          nhanPhoiRows = data.nhanPhoi || [];
          giaoHangRows = data.giaoHang || [];
          trackingLoaded.nhanphoi = true;
          trackingLoaded.giaohang = true;
          renderTrackingTable_('nhanPhoiResult', applyTrackingFilters_(nhanPhoiRows, trackingFilters.nhanphoi), 'nhanphoi');
          renderTrackingTable_('giaoHangResult', applyTrackingFilters_(giaoHangRows, trackingFilters.giaohang), 'giaohang');
          if (!initialSyncLoaded) { initialSyncLoaded = true; splashStepDone_(); }
        })
        .withFailureHandler(function(err) {
          renderTrackingTable_('nhanPhoiResult', [], 'nhanphoi');
          renderTrackingTable_('giaoHangResult', [], 'giaohang');
          showToast('Không tải được dữ liệu ban đầu: ' + err.message, 'error');
          if (!initialSyncLoaded) { initialSyncLoaded = true; splashStepDone_(); }
        })
        .getInitialAppData();
    }

    loadInitialAppData_();
    setInterval(refreshSyncStatus, SYNC_STATUS_REFRESH_MS);
    startTrackingPolling_(); // vô hại nếu chưa mở tab nào - activeTrackingTab_ đang null
  </script>

  <div id="toastStack"></div>

  <div id="filterPopup" class="filter-popup" style="display:none;">
    <div class="filter-popup-search">
      <input type="text" id="filterPopupSearch" placeholder="Tìm..." oninput="renderFilterOptions()" />
    </div>
    <label class="filter-select-all">
      <input type="checkbox" id="filterSelectAll" onchange="toggleSelectAll(this)" /> Chọn tất cả
    </label>
    <div id="filterPopupList" class="filter-popup-list"></div>
    <div class="filter-popup-actions">
      <button type="button" class="filter-cancel" onclick="closeFilterPopup()">Hủy</button>
      <button type="button" class="filter-ok" onclick="applyFilterPopup()">OK</button>
    </div>
  </div>
  <div id="colVisOverlay" class="colvis-overlay" style="display:none;">
    <div class="colvis-modal">
      <div class="colvis-header">
        <h3>Chọn cột hiển thị</h3>
        <span class="upbom-close" onclick="closeColumnVisibilityModal()">&times;</span>
      </div>
      <div class="colvis-actions">
        <button type="button" class="colvis-select-all" onclick="setAllColumnsVisible(true)">Chọn tất cả</button>
        <button type="button" class="colvis-select-none" onclick="setAllColumnsVisible(false)">Bỏ chọn tất cả</button>
      </div>
      <div id="colVisList" class="colvis-list"></div>
      <div class="colvis-footer">
        <button type="button" onclick="closeColumnVisibilityModal()">Đóng</button>
      </div>
    </div>
  </div>

  <div id="trackingOverlay" class="colvis-overlay" style="display:none;">
  <div class="colvis-modal" style="width:420px; max-height:90vh;">
    <div class="colvis-header">
      <h3 id="trackingModalTitle">Nhận phôi</h3>
      <span class="upbom-close" onclick="closeTrackingModal()">&times;</span>
    </div>
    <div style="padding:16px; display:flex; flex-direction:column; gap:10px; overflow-y:auto;">
      <div id="qrReaderWrap" style="display:none;">
        <div id="qrReader" style="width:100%;"></div>
        <button type="button" onclick="stopQrScan_()" style="margin-top:8px; background:#c62828; color:#fff; border:none; border-radius:4px; padding:8px; width:100%;">Dừng quét</button>
      </div>
      <button type="button" id="qrScanBtn" onclick="startQrScan_()" style="background:#003DA5; color:#fff; font-weight:bold; border:none; border-radius:4px; padding:10px; cursor:pointer;">
        <i class="fa-solid fa-qrcode"></i> Quét mã QR
      </button>

      <label>Lệnh sản xuất
        <input type="text" id="trackLsxInput" style="width:100%; padding:8px; box-sizing:border-box; font-size:15px;" onblur="autoFillTrackingDetail_()" />
      </label>
      <label>STT
        <input type="text" id="trackSttInput" style="width:100%; padding:8px; box-sizing:border-box; font-size:15px;" onblur="autoFillTrackingDetail_()" />
      </label>
      <label>MSCT
        <input type="text" id="trackMsctInput" style="width:100%; padding:8px; box-sizing:border-box; font-size:16px; background:#f5f5f5;" />
      </label>
      <label>Tên chi tiết
        <input type="text" id="trackTenCtInput" style="width:100%; padding:8px; box-sizing:border-box; font-size:16px; background:#f5f5f5;" />
      </label>
      <label>SL đơn hàng
        <input type="number" id="trackOrderQtyInput" min="1" readonly style="width:100%; padding:8px; box-sizing:border-box; font-size:15px; background:#f5f5f5;" />
      </label>
      <label id="trackQtyLabel">SL nhận
        <input type="number" id="trackQtyInput" min="1" style="width:100%; padding:8px; box-sizing:border-box; font-size:15px;" />
      </label>
      <label>Người thực hiện
        <select id="trackNguoiSelect" onchange="onTrackNguoiChange_()" style="width:100%; padding:8px; box-sizing:border-box; font-size:15px;"></select>
      </label>
      <input type="text" id="trackNguoiOther" placeholder="Nhập tên..." style="display:none; width:100%; padding:8px; box-sizing:border-box; font-size:15px;" />

      <button type="button" onclick="addToTrackingList_()" style="background:#00b894; color:#fff; font-weight:bold; border:none; border-radius:4px; padding:10px; cursor:pointer;">
        <i class="fa-solid fa-plus"></i> Thêm vào danh sách
      </button>

      <div id="trackingPendingWrap" style="display:none;">
        <div style="font-weight:bold; font-size:13px; margin:6px 0;">Danh sách chờ lưu:</div>
        <table style="width:100%; border-collapse:collapse; font-size:12px;">
          <thead><tr style="background:#f0f0f0;">
            <th style="border:1px solid #ddd; padding:4px;">LSX</th>
            <th style="border:1px solid #ddd; padding:4px;">STT</th>
            <th style="border:1px solid #ddd; padding:4px;">Tên chi tiết</th>
            <th style="border:1px solid #ddd; padding:4px;">SL</th>
            <th style="border:1px solid #ddd; padding:4px;"></th>
          </tr></thead>
          <tbody id="trackingPendingBody"></tbody>
        </table>
      </div>
    </div>
    <div class="upbom-footer">
      <button type="button" class="upbom-cancel" onclick="closeTrackingModal()">Hủy</button>
      <button type="button" id="trackSaveBtn" class="upbom-save" onclick="saveTrackingBatch_()">Lưu</button>
    </div>
  </div>
</div>
